        - heading "Overview" [level=3] [ref=e55]
        - paragraph [ref=e56]: Poisik is an AI-powered UX/UI design audit platform engineered as a production-grade SaaS. It combines a dual-AI critique engine (Groq Llama 3.3 primary, Gemini fallback with automatic failover) that scores any uploaded screenshot against real usability and accessibility heuristics, project-based history with real before/after comparison, Stripe billing with server-enforced plan gates (Free / Pro / Enterprise), a full notification and onboarding system, and complete FR/EN internationalization — all backed by a Neon Postgres schema.
        - heading "Capability Map" [level=3] [ref=e57]
        - generic [ref=e58]:
          - generic [ref=e59]:
            - generic [ref=e60]: Screenshot-to-Report Pipeline
            - generic [ref=e61]: "Upload a screenshot, get a structured critique: overall score, per-category breakdown, annotated issues with severity, and one-click \"fix in code\" snippets."
          - generic [ref=e62]:
            - generic [ref=e63]: Dual-AI Critique Engine
            - generic [ref=e64]: Groq Llama 3.3 (vision) primary, Gemini fallback with automatic failover; Zod-validated output schema plus a real WCAG contrast re-check layered on top of the AI's own accessibility read.
          - generic [ref=e65]:
            - generic [ref=e66]: Projects & History
            - generic [ref=e67]: Every analysis grouped by project, with real thumbnails, scores, and issue counts — no synthetic placeholders.
          - generic [ref=e68]:
            - generic [ref=e69]: Compare Mode
            - generic [ref=e70]: Side-by-side before/after audits with a computed score-lift percentage, category-delta table, and an AI-generated "key improvements" summary.
          - generic [ref=e71]:
            - generic [ref=e72]: Public Sharing & PDF Export
            - generic [ref=e73]: Toggle any report to a public read-only link, or export a branded PDF, without exposing the owner's authenticated shell.
          - generic [ref=e74]:
